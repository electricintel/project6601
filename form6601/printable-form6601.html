<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Printable Form 6601</title>
  <link rel="stylesheet" href="../site/styles.css">
  <style>
    body { background:#eee; }
    .form-container {
      width: 8.5in;
      margin:auto;
      background:#fff;
      padding:1in;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }
    .field { margin-bottom:1rem; }
    .label { font-weight:bold; }
    .box { border:1px solid #000; height:1.2rem; }
  </style>
</head>
<body>

<div class="form-container">
  <h1>Form 6601 — Declaration of Value</h1>

  <div class="field">
    <div class="label">Declarer Name</div>
    <div class="box"></div>
  </div>

  <div class="field">
    <div class="label">Declarer Type (Individual / Cooperative)</div>
    <div class="box"></div>
  </div>

  <div class="field">
    <div class="label">Value Stream</div>
    <div class="box"></div>
  </div>

  <div class="field">
    <div class="label">Description of Value</div>
    <div class="box" style="height:3rem;"></div>
  </div>

  <div class="field">
    <div class="label">Burden-Neutral Statement</div>
    <div class="box" style="height:2rem;"></div>
  </div>

  <div class="field">
    <div class="label">Classification-Clean Statement</div>
    <div class="box" style="height:2rem;"></div>
  </div>

  <div class="field">
    <div class="label">Date</div>
    <div class="box"></div>
  </div>

  <p style="margin-top:2rem;font-size:0.9rem;">
    Project6601 • A Freedom-Aligned Public Benefit Initiative
  </p>
</div>

</body>
</html>
